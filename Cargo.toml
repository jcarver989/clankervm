[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/jcarver989/clankervm"
homepage = "https://github.com/jcarver989/clankervm"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
async-stream = "0.3"
aws-config = { version = "1.8.18", features = ["behavior-version-latest"] }
aws-sdk-lambdamicrovms = "1.6.0"
aws-sdk-s3 = "1.144.0"
aws-smithy-types = ">=1.4.9, <1.7.0"
axum = "0.8.9"
base16ct = { version = "1.0", features = ["alloc"] }
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
nix = { version = "0.31", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11"
tempfile = "3.27"
thiserror = "2.0"
toml = "0.9"
humantime = "2.3"
tokio = "1.52.3"
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8.2", default-features = false, features = ["deflate"] }
