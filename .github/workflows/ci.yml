# Generated by framer. Do not edit by hand: change .framer/src/main.rs and run `cargo framer`.
name: CI
on:
  pull_request:
  push:
    branches: [main]
env:
  CARGO_INCREMENTAL: "0"
permissions:
  contents: read
jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.0
      - run: just fmt-check
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.0
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just lint
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.0
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just test-ci
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ runner.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.0
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: just doc-check
  framer:
    name: Generated files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.0
      - run: just framer-check
  dist:
    name: Release workflow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install tools
        uses: jdx/mise-action@v5.2.0
      - run: just dist-check
